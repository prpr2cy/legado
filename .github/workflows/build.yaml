name: Build legado APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '构建目标'
        required: true
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    # 启用并发限制，避免超过免费额度
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # ----------------------------------------------------------
      # 1. checkout 本仓库源码
      # ----------------------------------------------------------
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      # ----------------------------------------------------------
      # 4. JDK 17（AGP 8+ 必须）
      # ----------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ----------------------------------------------------------
      # 5. 缓存 Gradle
      # ----------------------------------------------------------
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # ----------------------------------------------------------
      # 6. 安装 Android SDK
      # ----------------------------------------------------------
      - name: Setup Android SDK
        run: |
          # GitHub runner 已预装 SDK，只需设置环境变量
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # 把 sdkmanager 加入 PATH（方便调用）
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      # ----------------------------------------------------------
      # 7. 缓存并安装需要的 SDK 组件
      # ----------------------------------------------------------
      - name: Cache Android SDK components
        uses: actions/cache@v4
        id: sdk-cache
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
            /usr/local/lib/android/sdk/platform-tools
          key: android-sdk-${{ runner.os }}-${{ hashFiles('/build.gradle') }}
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Install SDK/NDK/CMake
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;25.1.8937393" \
            "cmake;3.22.1" \
            "platform-tools"

      # ----------------------------------------------------------
      # 8. 给 gradlew 补可执行权限
      # ----------------------------------------------------------
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ----------------------------------------------------------
      # 9.1 构建 Release APK（显示完整错误详情）
      # ----------------------------------------------------------
      - name: Build Release APK
        env:
          GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m
          KOTLIN_COMPILER_HEAP_SIZE: 1536m
          KOTLIN_INCREMENTAL: false
          ORG_GRADLE_WORKERS_MAX: 1
        run: |
          ./gradlew clean
          ./gradlew app:assembleRelease \
            --no-daemon \
            --warn \
            --stacktrace \
            -Pkotlin.experimental.tryK2=false \
            -Pandroid.experimental.enableNewResourceShrinker=true \
            -Pandroid.enableR8=true \
            -Pandroid.enableR8.fullMode=true

      # ----------------------------------------------------------
      # 9.2 构建 Debug APK（显示完整错误详情）
      # ----------------------------------------------------------
      #- name: Build Debug APK
      #  env:
      #    GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=512m
      #    KOTLIN_COMPILER_HEAP_SIZE: 1536m
      #    KOTLIN_INCREMENTAL: false
      #    ORG_GRADLE_WORKERS_MAX: 1
      #  run: |
      #    ./gradlew clean
      #    ./gradlew app:assembleDebug \
      #      --no-daemon \
      #      --warn \
      #      --stacktrace \
      #      -Pkotlin.experimental.tryK2=false \
      #      -Pandroid.experimental.enableNewResourceShrinker=false \
      #      -Pandroid.enableR8=false \
      #      -Pandroid.enableR8.fullMode=false

      # ----------------------------------------------------------
      # 10. 上传 APK
      # ----------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-app-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 90
          if-no-files-found: error